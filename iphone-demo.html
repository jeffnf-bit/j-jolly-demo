<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e52"><title>J-Jolly • Demo iPhone</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142f50;background:#eef3fa}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;min-height:100dvh;margin:auto;background:#fff;padding-bottom:98px}.top{background:#102e52;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 19px 22px;border-radius:0 0 24px 24px}.logo{font-weight:900;font-size:29px;letter-spacing:-1px}.logo span{color:#55c4ff}.top p{color:#cbdff5;margin:8px 0 0}main{padding:18px}h1{font-size:24px;margin:8px 0 14px}h2{font-size:18px;margin:10px 0}p{line-height:1.5;color:#60758e}.muted{font-size:13px;color:#6b7d92}.banner{background:#e9f5ff;border-radius:16px;padding:14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.card{border:1px solid #dce6f2;border-radius:17px;background:white;box-shadow:0 3px 12px #1736540b}.tile{padding:16px 8px;text-align:center;min-height:115px;font-weight:700;color:#173654}.tile .pic{font-size:36px;display:block;margin-bottom:10px}.card{padding:16px;margin:12px 0}.btn{display:block;width:100%;background:#0b75cb;border:0;color:white;border-radius:13px;padding:15px;font-size:16px;font-weight:700;margin:10px 0;min-height:48px}.btn.secondary{background:#eaf3fc;color:#145181}.btn:disabled{opacity:.5}.link{border:0;background:transparent;color:#1268b2;font-weight:700;padding:10px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.line>div{min-width:0}.price{font-size:20px;font-weight:800;color:#0b75cb}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd6e4;border-radius:12px;font-size:16px;margin:6px 0 13px;background:#fff;color:#142f50}label{font-size:14px;font-weight:700}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;justify-content:space-around;background:white;border-top:1px solid #dce6f2;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:2}nav button{border:0;background:white;color:#254967;padding:8px 3px;font-size:12px;min-width:75px}.badge{display:inline-block;background:#ecf6ff;color:#155e9e;border-radius:20px;padding:5px 10px;font-size:12px}.warn{background:#fff5df;padding:12px;border-radius:12px;font-size:13px}.avatar{height:44px;width:44px;display:grid;place-items:center;border-radius:50%;background:#e8f2fc;font-size:23px;flex:none}a{color:#096bb8;text-underline-offset:3px}.steps{color:#60758e;font-size:13px;margin:0 0 12px}
</style></head><body><div class="app"><header class="top"><div class="logo">J-<span>Jolly</span></div><p>Trova la persona giusta, in pochi tocchi.</p></header><main id="root"></main><nav><button onclick="home()">⌂<br>Esplora</button><button onclick="bookings()">▣<br>Prenotazioni</button><button onclick="people()">♙<br>Utenti demo</button><button onclick="profile()">☰<br>Profilo</button></nav></div>
<script>
"use strict";
const cats=[["Pulizie","🛋️",["Casa","Ufficio","Azienda","Cantiere"]],["Baby Care","🧸",["Occasionale","Doposcuola","Serale","Giornata"]],["Senior Care","🤲",["Compagnia","Aiuto quotidiano","Accompagnamento","Assistenza"]],["Pet Care","🐕",["Passeggiata","Visita a domicilio","Compagnia","Cura animali"]],["Giardinaggio","🪴",["Giardino","Terrazzo","Potatura","Manutenzione"]],["Piccoli lavori","🛠️",["Montaggio","Riparazione","Idraulica base","Aiuto generico"]]];
const spots=[["Duomo di Milano","Piazza del Duomo, Milano, Italia"],["Castello Sforzesco","Piazza Castello, Milano, Italia"],["Stazione Centrale","Piazza Duca d'Aosta, Milano, Italia"],["Parco Sempione","Piazza Sempione, Milano, Italia"],["Porta Nuova","Piazza Gae Aulenti, Milano, Italia"],["Darsena","Piazza XXIV Maggio, Milano, Italia"]];
const clients=["Anna Demo","Luca Demo","Sara Demo","Paolo Demo","Elena Demo","Davide Demo"].map((name,i)=>({name,spot:i}));
const workers=["Giulia Demo","Marco Demo","Elisa Demo","Fabio Demo","Marta Demo","Roberto Demo"].map((name,i)=>({name,spot:(i+2)%6,price:[16,18,17,19,16,20][i],cats:i===0?[0,2]:i===1?[4,5]:i===2?[1,2]:i===3?[3,4]:i===4?[0,1]:[3,5]}));
let state={cat:0,sub:"",client:0,worker:0,date:"",time:"09:00",hours:2,booking:null};let bookingsData=[];try{bookingsData=JSON.parse(localStorage.getItem("jj_iphone_demo_bookings")||"[]");if(!Array.isArray(bookingsData))bookingsData=[]}catch(e){bookingsData=[]}
const root=document.getElementById("root");
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mapURL(address){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(address)}
function directions(address){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(address)}
function put(s){root.innerHTML=s;window.scrollTo(0,0)}
function persist(){try{localStorage.setItem("jj_iphone_demo_bookings",JSON.stringify(bookingsData))}catch(e){}}
function home(){put('<div class="banner"><b>Anteprima interattiva per iPhone</b><p class="muted">6 clienti e 6 lavoratori inventati, indirizzi di luoghi pubblici reali. Nessun pagamento o prenotazione reale.</p></div><h1>Di quale aiuto hai bisogno?</h1><div class="grid">'+cats.map((c,i)=>'<button class="tile" onclick="category('+i+')"><span class="pic">'+c[1]+'</span>'+c[0]+'</button>').join('')+'</div><p class="muted">Le icone illustrano le sei categorie, in questa demo provvisoria.</p>')}
function category(i){state.cat=i;put('<button class="link" onclick="home()">← Tutti i servizi</button><h1>'+cats[i][0]+'</h1><p>Che tipo di servizio ti serve?</p><div class="grid">'+cats[i][2].map((s,j)=>'<button class="tile" onclick="subcat('+j+')"><span class="pic">'+cats[i][1]+'</span>'+esc(s)+'</button>').join('')+'</div>')}
function subcat(j){state.sub=cats[state.cat][2][j];form()}
function form(){let d=new Date();d.setDate(d.getDate()+1);let min=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");put('<button class="link" onclick="category('+state.cat+')">← Sottocategorie</button><div class="steps">1 di 3 • Dettagli</div><h1>'+cats[state.cat][0]+' · '+esc(state.sub)+'</h1><label>Cliente dimostrativo</label><select id="client">'+clients.map((c,i)=>'<option value="'+i+'" '+(i===state.client?'selected':'')+'>'+c.name+'</option>').join('')+'</select><p class="muted">L’indirizzo sarà un punto pubblico, non un’abitazione privata.</p><label>Giorno</label><input id="date" type="date" min="'+min+'" value="'+(state.date||min)+'"><label>Ora</label><input id="time" type="time" value="'+state.time+'"><label>Durata</label><select id="hours">'+[1,2,3,4,5,6,7,8].map(n=>'<option '+(state.hours===n?'selected':'')+' value="'+n+'">'+n+' ore</option>').join('')+'</select><button class="btn" onclick="saveDetails()">Cerca lavoratori →</button>')}
function saveDetails(){state.client=Number(document.getElementById("client").value);state.date=document.getElementById("date").value;state.time=document.getElementById("time").value;state.hours=Number(document.getElementById("hours").value);if(!state.date||!state.time){alert("Scegli data e ora");return}chooseWorker()}
function chooseWorker(){let a=workers.map((w,i)=>({...w,i})).filter(w=>w.cats.includes(state.cat));put('<button class="link" onclick="form()">← Modifica dettagli</button><div class="steps">2 di 3 • Professionisti</div><h1>Scegli il lavoratore</h1><p class="muted">Disponibilità e tariffe simulate per collaudare il percorso.</p>'+a.map(w=>'<div class="card"><div class="line"><div class="avatar">👤</div><div><b>'+w.name+'</b><p class="muted">'+spots[w.spot][0]+'</p></div><div class="price">'+w.price+' €/h</div></div><button class="btn" onclick="reviewBooking('+w.i+')">Scegli '+w.name.split(" ")[0]+'</button></div>').join(''))}
function reviewBooking(i){state.worker=i;let w=workers[i],c=clients[state.client],spot=spots[c.spot],total=(w.price*state.hours*1.05);put('<button class="link" onclick="chooseWorker()">← Cambia lavoratore</button><div class="steps">3 di 3 • Conferma</div><h1>Riepilogo prenotazione</h1><div class="card"><p><b>Servizio:</b> '+cats[state.cat][0]+' – '+esc(state.sub)+'</p><p><b>Cliente:</b> '+c.name+'</p><p><b>Lavoratore:</b> '+w.name+'</p><p><b>Data:</b> '+esc(state.date)+' ore '+esc(state.time)+'</p><p><b>Durata:</b> '+state.hours+' ore</p><p><b>Luogo dimostrativo:</b> '+spot[1]+'</p><p><a target="_blank" rel="noopener" href="'+mapURL(spot[1])+'">Apri indirizzo in Google Maps</a></p><p>Prestazione: '+(w.price*state.hours).toFixed(2)+' €</p><p>Commissione simulata (5%): '+(w.price*state.hours*.05).toFixed(2)+' €</p><div class="price">Totale demo: '+total.toFixed(2)+' €</div></div><div class="warn">Nessun pagamento e nessuna richiesta inviata a persone vere.</div><button class="btn" onclick="confirmBooking()">Conferma prenotazione demo</button>')}
function confirmBooking(){let id=Date.now();bookingsData.unshift({id,cat:state.cat,sub:state.sub,client:state.client,worker:state.worker,date:state.date,time:state.time,hours:state.hours,status:"Richiesta inviata",pin:"",rating:0});persist();bookingDetail(id)}
function bookingDetail(id){let b=bookingsData.find(x=>x.id===id);if(!b){bookings();return}let c=clients[b.client],w=workers[b.worker],spot=spots[c.spot],status=b.status;put('<button class="link" onclick="bookings()">← Prenotazioni</button><h1>'+cats[b.cat][0]+' – '+esc(b.sub)+'</h1><span class="badge">'+esc(status)+'</span><div class="card"><p><b>Cliente:</b> '+c.name+'</p><p><b>Lavoratore:</b> '+w.name+'</p><p><b>Quando:</b> '+esc(b.date)+' alle '+esc(b.time)+'</p><p><b>Luogo di prova:</b> '+spot[1]+'</p><p><a target="_blank" rel="noopener" href="'+mapURL(spot[1])+'">📍 Vedi su Google Maps</a></p><p><a target="_blank" rel="noopener" href="'+directions(spot[1])+'">🧭 Avvia navigazione con Google Maps</a></p><p><b>Durata:</b> '+b.hours+' ore</p><div class="price">'+(w.price*b.hours*1.05).toFixed(2)+' € (simulati)</div></div>'+
(status==="Richiesta inviata"?'<button class="btn" onclick="advance('+id+',&#39;Confermato&#39;)">Simula accettazione lavoratore</button>':
status==="Confermato"?'<div class="banner"><b>PIN di prova: 2468</b><p class="muted">Il PIN viene mostrato solo dopo la conferma simulata.</p></div><label>Inserisci PIN per iniziare il servizio</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="4 cifre"><button class="btn" onclick="startService('+id+')">Conferma PIN e avvia</button>':
status==="In corso"?'<button class="btn secondary" onclick="extraHour('+id+')">Simula 1 ora aggiuntiva</button><button class="btn" onclick="advance('+id+',&#39;Completato&#39;)">Completa servizio</button>':
status==="Completato"&&!b.rating?'<h2>Lascia recensione</h2><select id="rating"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><button class="btn" onclick="rate('+id+')">Invia recensione demo</button>':
status==="Completato"?'<p>Hai valutato il servizio: '+b.rating+'/5 stelle.</p>':'')+'<p class="muted">Questa sequenza simula le azioni di entrambe le parti su un unico dispositivo.</p>')}
function advance(id,status){let b=bookingsData.find(x=>x.id===id);if(!b)return;b.status=status;persist();bookingDetail(id)}
function startService(id){if(document.getElementById("pin").value!=="2468"){alert("PIN non valido: prova 2468");return}advance(id,"In corso")}
function extraHour(id){let b=bookingsData.find(x=>x.id===id);if(b){b.hours+=1;persist();bookingDetail(id)}}
function rate(id){let b=bookingsData.find(x=>x.id===id);if(b){b.rating=Number(document.getElementById("rating").value);persist();bookingDetail(id)}}
function bookings(){put('<h1>Le mie prenotazioni demo</h1>'+(!bookingsData.length?'<p>Non hai prenotazioni. Scegli un servizio da Esplora.</p>':bookingsData.map(b=>'<div class="card"><b>'+cats[b.cat][0]+' · '+esc(b.sub)+'</b><p>'+clients[b.client].name+' · '+esc(b.date)+'</p><span class="badge">'+esc(b.status)+'</span><button class="btn" onclick="bookingDetail('+b.id+')">Apri prenotazione</button></div>').join(''))+'<button class="btn secondary" onclick="clearDemo()">Azzera prenotazioni di prova</button>')}
function clearDemo(){if(confirm("Eliminare tutte le prenotazioni dimostrative da questo dispositivo?")){bookingsData=[];persist();bookings()}}
function people(){put('<h1>Utenti dimostrativi</h1><p class="muted">Nomi inventati; luoghi pubblici reali a Milano.</p><h2>6 clienti</h2>'+clients.map(c=>'<div class="card"><b>'+c.name+'</b><p>'+spots[c.spot][1]+'</p><a href="'+mapURL(spots[c.spot][1])+'" target="_blank" rel="noopener">Apri Google Maps</a></div>').join('')+'<h2>6 lavoratori</h2>'+workers.map(w=>'<div class="card"><b>'+w.name+'</b><p>'+spots[w.spot][1]+' · '+w.price+' €/h</p><p>'+w.cats.map(i=>cats[i][0]).join(", ")+'</p><a href="'+mapURL(spots[w.spot][1])+'" target="_blank" rel="noopener">Apri Google Maps</a></div>').join(''))}
function profile(){put('<h1>Informazioni sulla demo</h1><div class="card"><p><b>Modalità:</b> simulazione locale per iPhone</p><p>Le prenotazioni vengono salvate soltanto in questo browser. Non ci sono login, controlli documentali, pagamenti, notifiche o sincronizzazione Supabase reali.</p><p>Le posizioni sono punti di interesse pubblici, non residenze private. I collegamenti a Google Maps aprono un servizio esterno.</p></div><button class="btn secondary" onclick="people()">Guarda i 12 profili di prova</button>')}
home();
</script></body></html>
