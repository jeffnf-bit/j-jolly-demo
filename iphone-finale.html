<style id="premium-v4">
:root{--navy:#0d2b50;--blue:#0873d8;--sky:#6bbdeb;--ink:#152c44;--muted:#65788d;--line:#e4ecf5;--paper:#f6f9fd;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{background:var(--paper);color:var(--ink)}
header{background:linear-gradient(112deg,#09274b,#103e72);padding:14px max(22px,calc((100vw - 1180px)/2));border-bottom:1px solid #ffffff1c;box-shadow:0 4px 24px #102d5040;position:relative}
header .brand{display:flex;align-items:center;letter-spacing:-.9px;font-size:26px}header .brand img{height:55px!important;width:55px!important;border-radius:13px!important;background:white;padding:3px;object-fit:contain}
header nav{gap:7px}header nav button{border-color:#ffffff45;padding:10px 13px;border-radius:12px;font-size:13px}header nav button.active{background:white;color:var(--navy)}
main{max-width:1080px;padding-top:28px}
.card{border:1px solid #e1eaf3;box-shadow:0 12px 30px #103b5a0b;border-radius:22px;padding:24px}
.hero{border-radius:28px;background:linear-gradient(110deg,#0b2b50 0%,#124b86 62%,#0a72b3 100%);padding:36px 38px;position:relative;overflow:hidden;box-shadow:0 16px 45px #0c43752c}
.hero:after{content:"";position:absolute;width:235px;height:235px;background:radial-gradient(circle,#7dd4ff66,transparent 68%);right:-40px;top:-40px;pointer-events:none}
.hero h1{font-size:clamp(29px,4vw,44px);line-height:1.09;letter-spacing:-1.6px;max-width:560px;margin-bottom:16px}.hero p{max-width:560px;color:#deefff}
.btn{background:linear-gradient(90deg,#0c78d8,#066bbd);border-radius:13px;font-weight:750;padding:14px 19px;box-shadow:0 4px 12px #1268b71b}
.btn.alt{background:#eaf4ff;color:#0e548d;box-shadow:none}.btn.red{background:#fff0f2;color:#ba2b43;box-shadow:none}
input,textarea,select{background:#fff;border:1px solid #cddbe7;border-radius:13px;outline-color:var(--blue)}
.premium-categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:20px}
.service-tile{border:1px solid #dfebf4;border-radius:20px;padding:21px;text-align:left;background:linear-gradient(135deg,#fff,#f9fcff);box-shadow:0 7px 19px #1438590a;cursor:pointer;display:flex;gap:15px;align-items:flex-start;min-height:132px;color:var(--navy);transition:transform .2s,box-shadow .2s}
.service-tile:hover{transform:translateY(-3px);box-shadow:0 13px 24px #16395d1c}
.service-tile .glyph{width:51px;height:51px;border-radius:15px;display:grid;place-items:center;flex-shrink:0;background:#eaf4ff;color:#106bc1}
.service-tile .glyph svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.service-tile strong{display:block;font-size:17px;letter-spacing:-.4px;margin:3px 0 6px}.service-tile small{font-size:12px;color:#6b7e90;line-height:1.45}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:#2088d1;margin-bottom:8px}
.intro-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:30px 0 10px}.intro-row h2{margin:0;font-size:24px;letter-spacing:-.7px}
.quick-search{display:flex;max-width:650px;gap:9px;margin-top:24px;padding:8px;background:white;border-radius:17px;box-shadow:0 9px 25px #082d5740;position:relative;z-index:1}.quick-search input{margin:0;border:0;min-width:0;flex:1}.quick-search .btn{white-space:nowrap;margin:0}
.demo-pill{display:inline-block;background:#e5f3ff;color:#116bab;padding:6px 12px;border-radius:100px;font-size:12px;font-weight:800}
.feature-strip{display:flex;gap:11px;flex-wrap:wrap;margin-top:16px}.feature-strip span{background:#ffffff1e;border:1px solid #ffffff2f;border-radius:40px;padding:7px 11px;color:#e7f7ff;font-size:13px}
.stepper{display:flex;gap:8px;margin:0 0 20px;align-items:center}.stepper span{background:#e9f2fd;border-radius:40px;padding:8px 12px;color:#33628a;font-size:12px}.stepper span.current{background:#0b6bc2;color:white}
.assistant{background:linear-gradient(125deg,#eaf5ff,#fff);border-color:#d1e9fa}
.worker-card{display:grid;grid-template-columns:auto 1fr;gap:15px;align-items:start}.avatar{width:58px;height:58px;border-radius:18px;background:#e2f2ff;color:#0f62a4;display:grid;place-items:center;font-weight:850;font-size:22px}
.pricing{background:#eaf4ff;border-radius:17px;padding:15px;margin:14px 0;color:#164b79}.pricing strong{font-size:22px}
nav button{transition:.2s}nav button:hover{transform:translateY(-1px)}
@media(max-width:720px){header{padding:13px 16px;gap:11px}header nav{width:100%;overflow-x:auto;flex-wrap:nowrap}header nav button{flex-shrink:0;font-size:12px}main{padding:15px 14px 40px}.premium-categories{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.service-tile{padding:13px;gap:10px;min-height:143px;flex-direction:column}.service-tile .glyph{width:43px;height:43px;border-radius:12px}.service-tile strong{font-size:15px}.hero{padding:25px 20px;border-radius:22px}.hero h1{font-size:31px}.quick-search{gap:3px}.quick-search .btn{padding:11px}.card{padding:18px}}

/* Solo icone/immagini delle 6 categorie, resto dell'interfaccia V4 invariato */
.service-tile{position:relative;overflow:hidden;isolation:isolate;min-height:168px;padding:16px 15px;align-items:stretch;display:flex;flex-direction:column;gap:5px}
.service-tile:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,#fff 47%,#ffffff1a 100%);pointer-events:none;z-index:0}
.service-tile .glyph{width:42px;height:42px;border-radius:0;display:block;flex:none;background:transparent;color:#075bc0;position:relative;z-index:2}
.service-tile .glyph svg{width:39px;height:39px;stroke-width:1.8}
.service-tile .service-copy{z-index:2;position:relative;max-width:73%;margin-top:0}
.service-tile strong{font-size:16px;margin:0 0 5px;line-height:1.15;color:#101b2b}
.service-tile small{display:block;color:#243341;font-size:12px;line-height:1.3}
.service-tile .service-illustration{position:absolute;z-index:1;right:-5px;bottom:-9px;width:55%;height:85%;object-fit:contain;object-position:right bottom;pointer-events:none}
@media(max-width:720px){.service-tile{min-height:165px;padding:15px 11px;gap:5px}.service-tile .glyph{width:37px;height:37px}.service-tile .glyph svg{width:34px;height:34px}.service-tile .service-copy{max-width:82%}.service-tile strong{font-size:15px}.service-tile small{font-size:11px}.service-tile .service-illustration{width:57%;height:80%;right:-11px;bottom:-8px}}
</style>

<script>
'use strict';
const URL='https://eonzfwojeuisfafyiean.supabase.co';
// Public publishable key only. NEVER embed service_role, database passwords or private keys.
const PUBLIC_KEY='sb_publishable_x-Kf5hD06TVxw_-LCIglLg_rIFpMdDT';
const S={sb:null,user:null,profile:null,view:'discover',services:[],worker:null,workers:[],bookings:[],selected:null,queryService:'cleaning'};
const el=id=>document.getElementById(id);const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>(Number(c||0)/100).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const fmt=s=>new Date(s).toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'});
const toast=(msg,isError=false)=>{el('flash').innerHTML=`<div class="card ${isError?'error':'ok'}" role="status">${safe(msg)}</div>`;setTimeout(()=>{if(el('flash'))el('flash').innerHTML=''},5000)};
const err=e=>{console.error(e);toast(e?.message||'Si è verificato un problema',true)};
function nav(){el('nav').innerHTML=S.user?['discover','bookings','worker','profile'].map(v=>`<button class="${S.view===v?'active':''}" onclick="go('${v}')">${{discover:'Cerca',bookings:'Prenotazioni',worker:'Lavoratore',profile:'Profilo'}[v]}</button>`).join(''):'';el('identity').innerHTML=S.user?`<span style="font-size:12px">${safe(S.user.email)}</span> <button class="btn alt" onclick="logout()">Esci</button>`:'<span class="pill">Ambiente di prova</span>'}
function go(v){S.view=v;render()}
async function init(){if(!window.supabase?.createClient){el('screen').innerHTML='<div class="card error">Impossibile caricare la libreria Supabase. Controlla la connessione Internet.</div>';return}S.sb=window.supabase.createClient(URL,PUBLIC_KEY);S.sb.auth.onAuthStateChange((_event,session)=>{if((session?.user?.id||null)!==(S.user?.id||null)){S.user=session?.user||null;setTimeout(()=>refresh(),50)}});const {data,error}=await S.sb.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')console.warn(error);S.user=data?.user||null;await refresh()}
async function refresh(){if(!S.sb)return;if(!S.user){S.profile=null;S.worker=null;S.bookings=[];nav();authPage();return}let {data,error}=await S.sb.from('profiles').select('id,role,full_name,city,postal_code,phone').eq('id',S.user.id).maybeSingle();if(error)return err(error);S.profile=data;const [srv,w,b]=await Promise.all([S.sb.from('services').select('id,label').eq('active',true),S.sb.from('worker_profiles').select('user_id,display_name,bio,photo_url,hourly_rate_cents,city,service_area,approved,available').eq('user_id',S.user.id).maybeSingle(),S.sb.from('bookings').select('id,client_id,worker_id,service_id,starts_at,ends_at,status,city,hourly_rate_cents,platform_fee_cents').order('starts_at',{ascending:false}).limit(100)]);if(srv.error)err(srv.error);S.services=srv.data||[];S.worker=w.data||null;S.bookings=b.data||[];nav();render()}
function authPage(){el('screen').innerHTML=`<div class="hero"><h1>Benvenuto in J-Jolly</h1><p>Ambiente di prova collegato al database reale. Nessun pagamento e nessuna prenotazione commerciale attiva.</p></div><div class="grid"><div class="card"><h2>Accedi</h2><form onsubmit="login(event)"><label>Email<input id="login-email" type="email" required autocomplete="email"></label><label>Password<input id="login-password" type="password" minlength="8" required autocomplete="current-password"></label><button class="btn">Accedi</button></form></div><div class="card"><h2>Crea un account di prova</h2><form onsubmit="signup(event)"><label>Nome<input id="signup-name" required maxlength="100"></label><label>Email<input id="signup-email" type="email" required autocomplete="email"></label><label>Password (almeno 8 caratteri)<input id="signup-password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn">Registrati</button></form><p class="muted">Potrebbe essere necessario confermare l'email prima del primo accesso.</p></div></div><div class="alert">Non usare documenti reali, dati bancari o indirizzi privati durante questa fase di test.</div>`}
async function login(e){e.preventDefault();const {error}=await S.sb.auth.signInWithPassword({email:el('login-email').value.trim(),password:el('login-password').value});if(error)return err(error);toast('Accesso effettuato');await refresh()}
async function signup(e){e.preventDefault();const {data,error}=await S.sb.auth.signUp({email:el('signup-email').value.trim(),password:el('signup-password').value,options:{data:{full_name:el('signup-name').value.trim()}}});if(error)return err(error);toast(data?.session?'Account creato':'Controlla la tua email per confermare la registrazione');if(data?.session)await refresh()}
async function logout(){const {error}=await S.sb.auth.signOut();if(error)return err(error);S.user=null;await refresh()}
function render(){nav();if(!S.user)return authPage();({discover,bookings,worker,profile,checkout}[S.view]||discover)()}
async function discover(){el('screen').innerHTML=`<div class="hero"><h1>Trova una mano quando serve</h1><p>Profili reali approvati, disponibilità e prenotazioni gestite dal database.</p></div><div class="card"><h2>Ricerca</h2><div class="cols"><label>Categoria<select id="service-filter">${S.services.map(s=>`<option value="${safe(s.id)}" ${s.id===S.queryService?'selected':''}>${safe(s.label)}</option>`).join('')}</select></label><label>Città (opzionale)<input id="city-filter" placeholder="Es. Milano"></label></div><button class="btn" onclick="findWorkers()">Cerca lavoratori</button><button class="btn alt" onclick="smartBooking()">✨ Trova qualcuno per me</button></div><div class="card"><h2>J-Jolly Assistant · guida iniziale</h2><p class="muted">Descrivi cosa ti serve: preparo la ricerca e una stima indicativa delle ore. Questa guida è basata su regole locali, non è ancora un assistente IA collegato.</p><textarea id="help-request" rows="3" maxlength="500" placeholder="Esempio: pulizie in casa di 90 mq con due bagni venerdì mattina a Milano"></textarea><button class="btn alt" onclick="assistantGuide()">Prepara la ricerca</button><div id="assistant-result" aria-live="polite"></div></div><div id="workers-result"></div>`;await findWorkers()}
async function findWorkers(){S.queryService=el('service-filter').value;const city=el('city-filter').value.trim();const q=S.sb.from('worker_services').select('worker_id,worker_profiles!inner(user_id,display_name,bio,hourly_rate_cents,city,service_area,approved,available)').eq('service_id',S.queryService).eq('worker_profiles.approved',true).eq('worker_profiles.available',true);const {data,error}=await q;if(error)return err(error);const workers=(data||[]).map(x=>x.worker_profiles).filter(x=>!city||String(x.city||'').toLowerCase().includes(city.toLowerCase()));S.workers=workers;el('workers-result').innerHTML=workers.length?`<div class="grid">${workers.map(w=>`<div class="card"><h3>👤 ${safe(w.display_name||'Professionista')}</h3><p>${safe(w.bio||'Nessuna descrizione')}</p><p>${safe(w.city)} · ${safe(w.service_area)}</p><strong>${money(w.hourly_rate_cents)}/ora</strong><br><button class="btn" onclick="chooseWorker('${w.user_id}')">Verifica orari</button></div>`).join('')}</div>`:`<div class="card"><h3>Nessun lavoratore approvato per questa ricerca</h3><p class="muted">Il database è nuovo. Per comparire qui, un lavoratore deve registrarsi, configurare i servizi e ricevere l'approvazione amministrativa.</p></div>`}

async function smartBooking(){
 const city=el('city-filter')?.value?.trim()||'';
 await findWorkers();
 const ranked=[...S.workers].sort((a,b)=>a.hourly_rate_cents-b.hourly_rate_cents).slice(0,3);
 const target=el('workers-result');
 if(!ranked.length){toast('Nessuna proposta disponibile: servono lavoratori verificati con disponibilità pubblicata.',true);return;}
 const candidates=await Promise.all(ranked.map(async w=>{
  const {data}=await S.sb.from('worker_availability').select('id').eq('worker_id',w.user_id).gte('ends_at',new Date().toISOString()).limit(1);
  return {...w,hasSlot:!!data?.length};
 }));
 const valid=candidates.filter(w=>w.hasSlot);
 if(!valid.length){target.innerHTML='<div class="card">Nessuno dei profili proposti ha disponibilità future. Prova la ricerca manuale.</div>';return;}
 target.innerHTML='<div class="card"><h2>✨ Le proposte disponibili</h2><p class="muted">Fino a tre profili verificati, ordinati per tariffa. Le recensioni non sono ancora usate come criterio di classifica.</p>'+valid.map(w=>`<div class="card"><strong>${safe(w.display_name||'Lavoratore')}</strong> · ${safe(w.city||city)} · ${money(w.hourly_rate_cents)}/ora <button class="btn alt" onclick="chooseWorker('${w.user_id}')">Vedi disponibilità</button></div>`).join('')+'</div>';
}
function assistantGuide(){
 const q=el('help-request')?.value?.toLowerCase().trim()||'';
 if(!q)return toast('Descrivi il servizio richiesto.',true);
 const service=/cane|gatto|animali|passeggiata/.test(q)?'pets':/giardin|prato|siepe|erba/.test(q)?'gardening':/ripar|montag|mensol|piccoli lavori/.test(q)?'handyman':'cleaning';
 const meters=Number(q.match(/(\d{2,3})\s*(?:mq|m2|metri quadrati)/)?.[1]||0);
 const hours=meters?Math.max(2,Math.min(8,Math.ceil(meters/35))):null;
 const elService=el('service-filter'); if(elService)elService.value=service;
 el('assistant-result').innerHTML=`<p><strong>Categoria suggerita:</strong> ${safe(S.services.find(s=>s.id===service)?.label||service)}. ${hours?`<strong>Durata indicativa:</strong> circa ${hours} ore, da confermare con il lavoratore.`:'Scegli durata e orario con il lavoratore.'} Nessuna prenotazione è stata effettuata.</p>`;
 findWorkers();
}
async function chooseWorker(id){S.selected=S.workers.find(w=>w.user_id===id);if(!S.selected)return;const {data,error}=await S.sb.from('worker_availability').select('starts_at,ends_at').eq('worker_id',id).gte('ends_at',new Date().toISOString()).order('starts_at').limit(40);if(error)return err(error);const opts=(data||[]).map((x,i)=>`<option value="${i}">${safe(fmt(x.starts_at))} — ${safe(fmt(x.ends_at))}</option>`).join('');S.slots=data||[];S.view='checkout';nav();el('screen').innerHTML=`<div class="card"><h1>Prenotazione con ${safe(S.selected.display_name)}</h1><p>Tariffa indicativa: ${money(S.selected.hourly_rate_cents)}/ora</p>${opts?`<form onsubmit="requestBooking(event)"><label>Disponibilità pubblicata<select id="slot">${opts}</select></label><label>Indirizzo (solo dopo accettazione al lavoratore)<input id="address" maxlength="200" required placeholder="Via di prova"></label><label>Numero civico<input id="number" maxlength="30" required></label><label>Città<input id="city" value="${safe(S.selected.city||'')}" required></label><label>CAP<input id="postal" maxlength="10"></label><label>Indicazioni<input id="instructions" maxlength="1000"></label><p class="alert">La richiesta usa l'intero intervallo pubblicato. Nessun importo verrà incassato.</p><button class="btn">Invia richiesta di prova</button></form>`:`<p>Il lavoratore non ha pubblicato disponibilità future.</p>`}<button class="btn alt" onclick="go('discover')">Torna alla ricerca</button></div>`}
async function requestBooking(e){e.preventDefault();const slot=S.slots[Number(el('slot').value)];if(!slot)return toast('Seleziona un orario',true);const payload={p_worker:S.selected.user_id,p_service:S.queryService,p_start:slot.starts_at,p_end:slot.ends_at,p_city:el('city').value,p_address:el('address').value,p_number:el('number').value,p_postal:el('postal').value,p_instructions:el('instructions').value};const {data,error}=await S.sb.rpc('request_booking',payload);if(error)return err(error);toast('Richiesta creata: '+data);S.view='bookings';await refresh()}
async function bookings(){let arr=S.bookings||[];el('screen').innerHTML=`<h1>Le mie prenotazioni</h1><p class="muted">Stati aggiornati dal database. Aggiorna per vedere le risposte dell'altro account.</p><button class="btn alt" onclick="refresh()">Aggiorna</button>${arr.map(b=>`<div class="card"><div class="row"><h3>${safe(S.services.find(s=>s.id===b.service_id)?.label||b.service_id)}</h3><span class="pill">${safe(b.status)}</span></div><p>${safe(fmt(b.starts_at))} · ${safe(b.city)}</p><p>Prestazione: ${money(b.hourly_rate_cents*(new Date(b.ends_at)-new Date(b.starts_at))/3600000)} · Tariffa piattaforma proposta: ${money(b.platform_fee_cents)} (non incassata)</p><div class="row"><div>${b.status==='requested'&&b.worker_id===S.user.id?`<button class="btn" onclick="answer('${b.id}',true)">Accetta</button><button class="btn red" onclick="answer('${b.id}',false)">Rifiuta</button>`:''}${['requested','confirmed'].includes(b.status)?`<button class="btn red" onclick="cancel('${b.id}')">Annulla</button>`:''}${b.status==='confirmed'&&b.worker_id===S.user.id?`<input id="pin-${b.id}" placeholder="PIN di arrivo" maxlength="4" inputmode="numeric"><button class="btn" onclick="arrival('${b.id}')">Conferma arrivo</button>`:''}${b.status==='ongoing'&&b.client_id===S.user.id?`<button class="btn" onclick="finish('${b.id}')">Conferma completamento</button>`:''}${['confirmed','ongoing','completed'].includes(b.status)?`<button class="btn alt" onclick="details('${b.id}')">Dettagli e chat</button>`:''}</div></div></div>`).join('')||'<div class="card">Non hai ancora prenotazioni.</div>'}`}
async function answer(id,accept){const {error}=await S.sb.rpc('respond_to_booking',{p_booking:id,p_accept:accept});if(error)return err(error);toast(accept?'Prenotazione accettata':'Richiesta rifiutata');await refresh()}
async function cancel(id){if(!confirm('Annullare questa richiesta di prova?'))return;const {error}=await S.sb.rpc('cancel_booking',{p_booking:id});if(error)return err(error);toast('Prenotazione annullata');await refresh()}
async function arrival(id){const pin=el('pin-'+id).value.trim();const {data,error}=await S.sb.rpc('confirm_arrival',{p_booking:id,p_pin:pin});if(error)return err(error);toast(({started:'Arrivo confermato',incorrect_pin:'PIN errato',locked:'PIN bloccato: contatta assistenza'})[data]||data,data!=='started');await refresh()}
async function finish(id){if(!confirm('Confermi il completamento del servizio di prova?'))return;const {error}=await S.sb.rpc('complete_booking',{p_booking:id});if(error)return err(error);toast('Servizio completato');await refresh()}
async function details(id){const b=S.bookings.find(x=>x.id===id);if(!b)return;let [a,p,m]=await Promise.all([S.sb.from('booking_addresses').select('address,street_number,postal_code,instructions').eq('booking_id',id).maybeSingle(),S.sb.from('booking_pins').select('booking_id,pin_plain').eq('booking_id',id).maybeSingle(),S.sb.from('booking_messages').select('id,sender_id,body,created_at').eq('booking_id',id).order('created_at')]);if(a.error&&a.error.code!=='PGRST116')err(a.error);if(p.error&&p.error.code!=='PGRST116')console.info('PIN visible only to client');if(m.error)err(m.error);const address=a.data?`${a.data.address} ${a.data.street_number||''}, ${b.city}`:'';el('screen').innerHTML=`<div class="card"><h2>Dettagli prenotazione</h2><p><b>Stato:</b> ${safe(b.status)}</p><p><b>Data:</b> ${safe(fmt(b.starts_at))}</p>${address?`<p><b>Indirizzo:</b> ${safe(address)}</p><a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}">Apri navigatore</a>`:'<p class="muted">Indirizzo non ancora visibile al lavoratore.</p>'}${p.data?.pin_plain?`<p class="alert">PIN da comunicare al lavoratore all'arrivo: <b>${safe(p.data.pin_plain)}</b></p>`:''}</div><div class="card"><h2>Chat</h2>${(m.data||[]).map(msg=>`<blockquote><b>${msg.sender_id===S.user.id?'Tu':'Altro utente'}</b> · ${safe(fmt(msg.created_at))}<p>${safe(msg.body)}</p></blockquote>`).join('')||'<p>Nessun messaggio.</p>'}<form onsubmit="message(event,'${id}')"><label>Messaggio<textarea id="message-text" maxlength="3000" required></textarea></label><button class="btn">Invia</button></form></div><button class="btn alt" onclick="go('bookings')">Indietro</button>`}
async function message(e,id){e.preventDefault();const {error}=await S.sb.from('booking_messages').insert({booking_id:id,sender_id:S.user.id,body:el('message-text').value.trim()});if(error)return err(error);toast('Messaggio inviato');await details(id)}
async function worker(){if(!S.worker){el('screen').innerHTML=`<div class="card"><h1>Diventa un lavoratore J-Jolly</h1><p>Attiveremo la tua area lavoratore. Il profilo non sarà visibile pubblicamente prima della verifica amministrativa.</p><button class="btn" onclick="becomeWorker()">Attiva area lavoratore</button></div>`;return}const {data:srv}=await S.sb.from('worker_services').select('service_id').eq('worker_id',S.user.id);const {data:slots}=await S.sb.from('worker_availability').select('id,starts_at,ends_at').eq('worker_id',S.user.id).gte('ends_at',new Date().toISOString()).order('starts_at').limit(60);S.myServices=(srv||[]).map(x=>x.service_id);el('screen').innerHTML=`<h1>Area lavoratore</h1><div class="alert">Approvazione: <b>${S.worker.approved?'approvato':'in attesa'}</b>. Non caricare documenti qui: la verifica identità richiederà un flusso protetto.</div><div class="card"><h2>Profilo</h2><form onsubmit="saveWorker(event)"><label>Nome visibile<input id="w-name" value="${safe(S.worker.display_name)}" required maxlength="100"></label><label>Descrizione<textarea id="w-bio" maxlength="1500">${safe(S.worker.bio)}</textarea></label><div class="cols"><label>Tariffa €/ora<input id="w-rate" type="number" min="1" max="1000" step="0.01" value="${S.worker.hourly_rate_cents/100}"></label><label>Città<input id="w-city" value="${safe(S.worker.city||'')}"></label><label>Zona operativa<input id="w-area" value="${safe(S.worker.service_area||'')}"></label><label>Disponibilità<select id="w-available"><option value="true" ${S.worker.available?'selected':''}>Attiva</option><option value="false" ${!S.worker.available?'selected':''}>Pausa</option></select></label></div><button class="btn">Salva profilo</button></form></div><div class="card"><h2>Servizi offerti</h2>${S.services.map(s=>`<label><input style="width:auto" type="checkbox" id="svc-${s.id}" ${S.myServices.includes(s.id)?'checked':''}> ${safe(s.label)}</label>`).join('')}<button class="btn" onclick="saveServices()">Salva categorie</button></div><div class="card"><h2>Disponibilità</h2><form onsubmit="addSlot(event)"><div class="cols"><label>Inizio<input type="datetime-local" id="slot-start" required></label><label>Fine<input type="datetime-local" id="slot-end" required></label></div><button class="btn">Aggiungi intervallo</button></form>${(slots||[]).map(t=>`<div class="row"><span>${safe(fmt(t.starts_at))} — ${safe(fmt(t.ends_at))}</span><button class="btn red" onclick="deleteSlot('${t.id}')">Elimina</button></div>`).join('')}</div><button class="btn alt" onclick="go('bookings')">Visualizza richieste</button>`}
async function becomeWorker(){const {error}=await S.sb.rpc('become_worker');if(error)return err(error);toast('Profilo lavoratore creato, in attesa di approvazione');await refresh()}
async function saveWorker(e){e.preventDefault();const patch={display_name:el('w-name').value.trim(),bio:el('w-bio').value.trim(),hourly_rate_cents:Math.round(Number(el('w-rate').value)*100),city:el('w-city').value.trim(),service_area:el('w-area').value.trim(),available:el('w-available').value==='true'};const {error}=await S.sb.from('worker_profiles').update(patch).eq('user_id',S.user.id);if(error)return err(error);toast('Profilo aggiornato');await refresh()}
async function saveServices(){const chosen=S.services.filter(s=>el('svc-'+s.id).checked).map(s=>s.id);let {error}=await S.sb.from('worker_services').delete().eq('worker_id',S.user.id);if(error)return err(error);if(chosen.length){({error}=await S.sb.from('worker_services').insert(chosen.map(service_id=>({worker_id:S.user.id,service_id}))));if(error)return err(error)}toast('Categorie salvate');await worker()}
async function addSlot(e){e.preventDefault();const from=new Date(el('slot-start').value),to=new Date(el('slot-end').value);if(!(from>new Date()&&to>from&&to-from<=12*3600000))return toast('Intervallo non valido: massimo 12 ore e inizio futuro',true);const {error}=await S.sb.from('worker_availability').insert({worker_id:S.user.id,starts_at:from.toISOString(),ends_at:to.toISOString()});if(error)return err(error);toast('Disponibilità salvata');await worker()}
async function deleteSlot(id){const {error}=await S.sb.from('worker_availability').delete().eq('id',id);if(error)return err(error);toast('Intervallo eliminato');await worker()}
function profile(){el('screen').innerHTML=`<div class="card"><h1>Il mio profilo</h1><p class="muted">Email dell’account: ${safe(S.user.email)}</p><form onsubmit="saveProfile(event)"><label>Nome<input id="p-name" value="${safe(S.profile?.full_name)}" required></label><label>Telefono<input id="p-phone" value="${safe(S.profile?.phone)}"></label><label>Città<input id="p-city" value="${safe(S.profile?.city)}"></label><label>CAP<input id="p-cap" value="${safe(S.profile?.postal_code)}"></label><button class="btn">Salva</button></form></div><div class="card"><h2>Ambiente di test</h2><p>Le prenotazioni vengono conservate nel database reale. Non effettuare prenotazioni commerciali né usare documenti o indirizzi personali reali finché la piattaforma non avrà completato il collaudo e la revisione legale.</p><p><a href="https://www.inps.it" target="_blank" rel="noopener noreferrer">Sito ufficiale INPS</a></p></div>`}
async function saveProfile(e){e.preventDefault();const {error}=await S.sb.from('profiles').update({full_name:el('p-name').value.trim(),phone:el('p-phone').value.trim(),city:el('p-city').value.trim(),postal_code:el('p-cap').value.trim()}).eq('id',S.user.id);if(error)return err(error);toast('Profilo salvato');await refresh()}

function demoHome(){demoNav();demo.mode='client';demoRender(`
<section class="hero"><span class="demo-pill">ANTEPRIMA INTERATTIVA · NESSUN PAGAMENTO</span><h1>Più tempo per ciò che ami.<br>Al resto pensiamo insieme.</h1><p>Trova aiuto per la casa e la famiglia in pochi passaggi. Scegli il servizio, quando ti serve e la persona giusta.</p>

<div class="premium-categories">${demoServices.map(s=>`<button class="service-tile" onclick="demoChoose('${s[0]}')">${ico(s[0])}<div class="service-copy"><strong>${s[1]}</strong><small>${s[2]}</small></div></button>`).join('')}</div>
<div class="grid" style="margin-top:23px"><div class="card assistant"><div class="eyebrow">J-Jolly Smart</div><h2>Trova qualcuno per me</h2><p>Una ricerca guidata, pensata anche per chi non usa spesso le app.</p><button class="btn" onclick="demoSmart()">Inizia la ricerca</button></div><div class="card"><div class="eyebrow">J-Jolly Assistant · demo</div><h2>Raccontaci cosa ti serve</h2><p class="muted">Suggerimenti basati su regole: l'IA conversazionale completa non è ancora attiva.</p><textarea id="demo-ask" placeholder="Esempio: pulizie appartamento 90 mq, venerdì mattina" rows="2"></textarea><button class="btn alt" onclick="demoAssistant()">Suggerisci durata e categoria</button><div id="demo-tip"></div></div></div>
<p class="muted" style="font-size:12px;margin-top:22px">Ambiente di prova con lavoratori simulati. Nessun servizio, pagamento o verifica identità reale.</p>`)}
function demoSearch(){const t=(el('demo-search')?.value||'').trim().toLowerCase();demoChoose(guessService(t))}
function guessService(q){return /bambin|baby|babysitt/.test(q)?'babysitting':/anzian|senior|compagnia/.test(q)?'senior_care':/can|gatt|animal|pet/.test(q)?'pets':/giardin|prato|erba|verde/.test(q)?'gardening':/ripara|monta|mensola|lavori|rubinetto/.test(q)?'handyman':'cleaning'}
function demoChoose(s){demo.service=s;demoCalendar()}
function demoSmart(){demoCalendar()}
function demoAssistant(){const q=(el('demo-ask')?.value||'').toLowerCase();demo.service=guessService(q);let m=Number(q.match(/(\d{2,3})\s*(?:mq|m2)/)?.[1]||0);demo.hours=m?Math.max(2,Math.min(8,Math.ceil(m/35))):3;el('demo-tip').innerHTML='<div class="pricing">Ti suggeriamo <strong>'+demoSvc(demo.service)[1]+'</strong>, circa '+demo.hours+' ore (stima indicativa).</div><button class="btn" onclick="demoCalendar()">Continua</button>'}
function demoCalendar(){const today=new Date();today.setDate(today.getDate()+1);const iso=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');demoRender(`<div class="stepper"><span class="current">1 · Servizio e orario</span><span>2 · Lavoratore</span><span>3 · Conferma</span></div><div class="card"><div class="eyebrow">Prenotazione guidata</div><h1>${demoSvc(demo.service)[1]}</h1><p>${demoSvc(demo.service)[2]}</p><label>Categoria<select id="demo-service">${demoServices.map(s=>`<option value="${s[0]}" ${demo.service===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></label><label>Data<input id="demo-date" type="date" min="${iso}" value="${demo.date>=iso?demo.date:iso}"></label><label>Orario<input id="demo-time" type="time" value="${demo.time}"></label><label>Durata<select id="demo-hours">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${demo.hours===i+1?'selected':''}>${i+1} ${i?'ore':'ora'}</option>`).join('')}</select></label><button class="btn" onclick="demoFind()">Mostra i lavoratori</button><button class="btn alt" onclick="demoHome()">Indietro</button></div>`)}
function demoFind(){demo.service=el('demo-service').value;demo.date=el('demo-date').value;demo.time=el('demo-time').value;demo.hours=Number(el('demo-hours').value);if(!demo.date)return alert('Seleziona una data');demoRender(`<div class="stepper"><span>1 · Servizio e orario</span><span class="current">2 · Lavoratore</span><span>3 · Conferma</span></div><div class="eyebrow">Tre proposte dimostrative</div><h1>Seleziona il lavoratore</h1><p class="muted">I nomi qui sotto sono simulati. Nella modalità reale appariranno soltanto profili approvati e disponibili.</p><div class="grid">${demoPeople.map((p,i)=>`<div class="card"><div class="worker-card"><div class="avatar">${p.name.slice(0,1)}</div><div><h2 style="margin:0">${p.name}</h2><small>${p.tag}</small><p>★ ${p.rating} · ${p.zone}</p></div></div><div class="pricing"><strong>${demoMoney(p.rate)}</strong> / ora</div><button class="btn" onclick="demoSelect(${i})">Seleziona</button><button class="btn alt" onclick="demoFavorite(${i})">♡ Preferito</button></div>`).join('')}</div><button class="btn alt" onclick="demoCalendar()">Indietro</button>`)}
function demoFavorite(i){demo.favorites.add(demoPeople[i].name);alert('Salvato nei preferiti della demo')}
function demoSelect(i){demo.worker=demoPeople[i].name;demo.rate=demoPeople[i].rate;demoCheckout()}
function demoCheckout(){const cost=demo.hours*demo.rate,fee=demo.hours*.4;demoRender(`<div class="stepper"><span>1 · Servizio e orario</span><span>2 · Lavoratore</span><span class="current">3 · Conferma</span></div><div class="card"><div class="eyebrow">Riepilogo della richiesta</div><h1>Ci siamo quasi!</h1><p><strong>${demoSvc(demo.service)[1]}</strong> con ${demo.worker}</p><p>${demo.date} alle ${demo.time} · ${demo.hours} ore</p><label>Indirizzo di prova (non inserire indirizzi reali)<input id="demo-address" placeholder="Via Esempio 12" value="${demo.address.replaceAll('"','&quot;')}"></label><label>Indicazioni facoltative<textarea id="demo-notes" placeholder="Es. citofono scala B">${demo.notes.replaceAll('<','&lt;')}</textarea></label><div class="pricing"><p>Compenso simulato: ${demoMoney(cost)}</p><p>Commissione cliente simulata: ${demoMoney(fee)}</p><h2>Totale indicativo: ${demoMoney(cost+fee)}</h2></div><p class="muted">Nessun addebito reale. I servizi Baby Care e Senior Care richiedono ulteriori verifiche di idoneità e sicurezza prima del lancio.</p><button class="btn" onclick="demoConfirm()">Invia richiesta di prova</button><button class="btn alt" onclick="demoFind()">Indietro</button></div>`)}
function demoConfirm(){demo.address=(el('demo-address')?.value||'Via Esempio 12').trim()||'Via Esempio 12';demo.notes=(el('demo-notes')?.value||'').trim();demo.booking={status:'requested',pin:'4826',startedAt:null,reviewed:false,extensions:0};demoBookings()}
const dStatus={requested:'In attesa di accettazione',confirmed:'Confermata',ongoing:'In corso',completed:'Completata',cancelled:'Annullata'};
function demoBookings(){demoNav();const b=demo.booking;if(!b)return demoRender('<div class="card"><h1>Le tue prenotazioni</h1><p>Non ci sono prenotazioni attive.</p><button class="btn" onclick="demoHome()">Esplora i servizi</button></div>');demoRender(`<div class="card"><div class="eyebrow">Le mie prenotazioni · Demo</div><h1>${demoSvc(demo.service)[1]}</h1><p>Con ${demo.worker} · ${demo.date}, ore ${demo.time}</p><p>Durata: ${demo.hours} ore</p><span class="pill">${dStatus[b.status]}</span><div class="pricing">${b.status==='requested'?'Il lavoratore vede soltanto la zona, non il tuo indirizzo.':b.status==='cancelled'?'La prenotazione è annullata.':'Indirizzo condiviso solo dopo l’accettazione.'}</div>${b.status==='confirmed'?'<p>PIN cliente per confermare l’arrivo: <strong>4826</strong></p>':''}${b.status==='ongoing'?'<p>Il servizio è iniziato. Puoi chiedere un’ora aggiuntiva.</p>':''}${b.status==='completed'?'<p>Servizio completato. Nessun pagamento reale.</p>':''}${b.status==='requested'?'<button class="btn" onclick="demoAccept()">Simula accettazione</button>':''}${b.status==='confirmed'?'<button class="btn" onclick="demoArrival()">Simula arrivo tramite PIN</button>':''}${b.status==='ongoing'?'<button class="btn alt" onclick="demoExtend()">Chiedi 1 ora in più</button><button class="btn" onclick="demoComplete()">Conferma completamento</button>':''}${b.status==='completed'&&!b.reviewed?'<label>Recensione<select id="demo-rating"><option value="5">5 stelle</option><option value="4">4 stelle</option><option value="3">3 stelle</option><option value="2">2 stelle</option><option value="1">1 stella</option></select></label><button class="btn" onclick="demoReview()">Invia recensione demo</button>':''}${['requested','confirmed'].includes(b.status)?'<button class="btn red" onclick="demoCancel()">Annulla prenotazione</button>':''}<button class="btn alt" onclick="demoHome()">Torna alla Home</button></div>`)}
function demoAccept(){if(demo.booking?.status!=='requested')return;demo.booking.status='confirmed';demoBookings()}
function demoArrival(){if(demo.booking?.status!=='confirmed')return;const p=prompt('Inserisci il PIN di prova (4826)');if(p===demo.booking.pin){demo.booking.status='ongoing';demo.booking.startedAt=Date.now();demoBookings()}else if(p!==null)alert('PIN errato')}
function demoExtend(){if(demo.booking?.status!=='ongoing')return;if(window.confirm('Simulare l’accettazione del lavoratore per 1 ora aggiuntiva?')){demo.hours++;demo.booking.extensions++;demoBookings()}}
function demoComplete(){if(demo.booking?.status!=='ongoing')return;demo.booking.status='completed';demoBookings()}
function demoReview(){if(demo.booking?.status!=='completed')return;demo.lastReview=el('demo-rating')?.value;demo.booking.reviewed=true;demoBookings();alert('Recensione demo salvata')}
function demoCancel(){if(!demo.booking||!['requested','confirmed'].includes(demo.booking.status))return;if(window.confirm('Vuoi annullare la prenotazione dimostrativa?')){demo.booking.status='cancelled';demoBookings()}}
function demoWorker(){demoNav();const b=demo.booking;demoRender(`<div class="card"><div class="eyebrow">Dashboard professionista · Demo</div><h1>La tua giornata</h1><p>Gestisci disponibilità, richieste e spostamenti.</p><div class="pricing"><strong>${b&&b.status!=='cancelled'?'1 richiesta':'0 richieste'}</strong><p>Stato: ${b?dStatus[b.status]:'Nessuna prenotazione'}</p></div>${b?`<h3>${demoSvc(demo.service)[1]} · ${demo.hours} ore</h3><p>Zona: Centro · Il luogo completo è riservato fino all'accettazione.</p>${b.status==='requested'?'<button class="btn" onclick="demoAccept();demoWorker()">Accetta richiesta</button>':''}${['confirmed','ongoing','completed'].includes(b.status)?`<p><strong>Indirizzo di prova:</strong> ${demo.address.replaceAll('<','&lt;')}</p><button class="btn alt" onclick="demoNavigate()">Apri navigatore</button>`:''}${b.status==='confirmed'?'<button class="btn" onclick="demoArrival();demoWorker()">Conferma arrivo con PIN</button>':''}`:''}<p class="muted">Nella versione reale i documenti sono riservati agli amministratori. Nessun lavoratore è automaticamente approvato.</p><button class="btn alt" onclick="demoBookings()">Visualizza prenotazione cliente</button><button class="btn" onclick="connectReal()">Collegati a Supabase</button></div>`)}
function demoNavigate(){if(!demo.booking||!['confirmed','ongoing','completed'].includes(demo.booking.status))return;window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Piazza Duomo, Milano'),'_blank','noopener,noreferrer')}
function demoProfile(){demoNav();demoRender(`<div class="card"><div class="eyebrow">Profilo · Demo</div><h1>Il tuo spazio J-Jolly</h1><p>Preferiti: ${([...demo.favorites].join(', ')||'Nessuno')}</p><p>Ultima recensione simulata: ${demo.lastReview?demo.lastReview+' / 5':'Nessuna'}</p><div class="pricing"><h3>Guadagni e INPS</h3><p>Report e istruzioni sono da completare e dipendono dall'inquadramento del lavoratore. Non sostituiscono gli adempimenti ufficiali.</p><a href="https://www.inps.it" target="_blank" rel="noopener noreferrer">Portale INPS</a></div><button class="btn" onclick="connectReal()">Accedi alla modalità reale (in collaudo)</button><button class="btn alt" onclick="demoHome()">Home</button></div>`)}
async function loadSupabaseLibrary(){
 if(window.supabase?.createClient)return;
 await new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  script.async=true;
  const timeout=setTimeout(()=>{script.remove();reject(new Error('Libreria Supabase non raggiungibile'))},7000);
  script.onload=()=>{clearTimeout(timeout);window.supabase?.createClient?resolve():reject(new Error('Libreria non disponibile'))};
  script.onerror=()=>{clearTimeout(timeout);reject(new Error('Connessione Supabase non disponibile'))};
  document.head.appendChild(script);
 });
}
async function connectReal(){el('nav').innerHTML='';el('screen').innerHTML='<div class="card"><h2>Collegamento Supabase...</h2><p>La modalità di prova rimane sempre disponibile.</p><button class="btn alt" onclick="demoHome()">Torna alla demo</button></div>';try{const wait=()=>new Promise((_,reject)=>setTimeout(()=>reject(new Error('Tempo di attesa scaduto')),8000));await Promise.race([loadSupabaseLibrary().then(init),wait()])}catch(e){el('screen').innerHTML='<div class="card"><h2>Collegamento non disponibile</h2><p>'+String(e.message).replace(/[<>]/g,'')+'</p><button class="btn" onclick="demoHome()">Apri la demo</button></div>'}}
demoHome();
</script>
